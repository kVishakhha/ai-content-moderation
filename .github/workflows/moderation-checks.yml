name: Moderation service checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moderation-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m compileall -q app tests

      - name: Run deterministic rule tests
        run: python -m unittest discover -s tests -p "test_rules.py" -v
