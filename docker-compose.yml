services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_moderation}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ./user-service
    environment:
      USER_SERVICE_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ai_moderation}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy

  chat-service:
    build: ./chat-service
    environment:
      CHAT_SERVICE_PORT: 3002
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-15mb}
      MODERATION_TIMEOUT_MS: ${MODERATION_TIMEOUT_MS:-30000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ai_moderation}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      MODERATION_SERVICE_URL: http://moderation-service:3003
      IMAGE_STORAGE_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    volumes:
      - chat_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      moderation-service:
        condition: service_started

  moderation-service:
    build: ./moderation-service
    environment:
      MODERATION_SERVICE_PORT: 3003
      WEAPON_MODEL_PATH: /models/weapons/best.pt
    volumes:
      - ./moderation-service/models:/models:ro

  api-gateway:
    build: ./api-gateway
    environment:
      GATEWAY_PORT: 3000
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-15mb}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      USER_SERVICE_URL: http://user-service:3001
      CHAT_SERVICE_URL: http://chat-service:3002
      MODERATION_SERVICE_URL: http://moderation-service:3003
    depends_on:
      - user-service
      - chat-service
      - moderation-service
    ports:
      - "${GATEWAY_PORT:-3000}:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - api-gateway
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
  chat_uploads:
